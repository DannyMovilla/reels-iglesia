# Instalador de Windows de Reels Iglesia (npm run dist). Ver docs/superpowers/notas/2026-11-06-prueba-plan-3.md (D4).
appId: org.reelsiglesia.app
productName: Reels Iglesia
directories:
  output: dist
files:
  - out/**
  - package.json
asar: true
# Se ejecutan con Node fuera del asar (CLI de HyperFrames) o se sirven al render/vista previa.
asarUnpack:
  - node_modules/hyperframes/**
  - node_modules/@hyperframes/**
  - node_modules/gsap/**
  - node_modules/@fontsource/**
extraResources:
  - from: python
    to: python
    filter: ["*.py", "requirements*.txt"]
  - from: modelos
    to: modelos
win:
  target: nsis
  icon: build/icon.ico
  # Sin firma de código: winCodeSign necesita el modo de desarrollador de Windows (D4).
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Reels Iglesia
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
npmRebuild: false
afterPack: build/despues-empaquetar.cjs
